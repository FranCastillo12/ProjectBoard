<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Projects</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eaf0f2;--surface:#fff;--ink:#14232a;--muted:#6b7d85;--line:#dde5e8;--side:#0f2227;--pc:#0e7c78;--warn:#c2410c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1115;--surface:#141e24;--ink:#e8eef0;--muted:#8a9ba2;--line:#243038;--side:#091418;--warn:#ff9a72}}
:root[data-theme="dark"]{--bg:#0b1115;--surface:#141e24;--ink:#e8eef0;--muted:#8a9ba2;--line:#243038;--side:#091418;--warn:#ff9a72}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Bricolage Grotesque",system-ui,sans-serif}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
@media(max-width:800px){.app{grid-template-columns:1fr}}
input,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding:9px 0;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--pc)}
textarea{resize:vertical;min-height:110px;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}
input::placeholder,textarea::placeholder{color:var(--muted)}
button{cursor:pointer;border:0;background:none;padding:6px 0;color:var(--muted);transition:color .15s,transform .1s}
button:hover{color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pc);outline-offset:3px}
button.main{background:var(--pc);color:#fff;font-weight:600;border-radius:9px;padding:8px 16px}
button.main:hover{color:#fff;filter:brightness(1.1)}
button.main:active{transform:scale(.97)}

.side{background:var(--side);color:#cfe0e3;padding:32px 22px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
@media(max-width:800px){.side{position:static;height:auto;padding:24px 18px}}
.brand{font-size:1.5rem;font-weight:800;color:#fff;letter-spacing:-.02em;margin:0}
.brand span{color:#5fd4cf}
.tag{font-size:.85rem;color:#7f9aa0;margin:2px 0 24px}
.side form{display:flex;gap:8px;margin-bottom:22px}
.side input{border-bottom-color:#2b4248;color:#fff}
.side input::placeholder{color:#7f9aa0}
.pbtn{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:6px;border-radius:10px;color:#a9c0c4;border:1px solid transparent}
.pbtn:hover{background:#17323a;color:#fff}
.pbtn.on{background:#17323a;color:#fff;border-color:#2b4a52}
.pbtn .n{display:flex;align-items:center;gap:10px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pbtn small{display:block;font-size:.78rem;color:#7f9aa0;margin:2px 0 6px 20px}
.mini{height:3px;background:#24404a;border-radius:2px;margin-left:20px;overflow:hidden}
.mini i{display:block;height:100%}

main{padding:36px 40px 80px;max-width:980px;width:100%}
@media(max-width:800px){main{padding:20px 16px 56px}}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 20%,var(--surface)),var(--surface) 70%);border:1px solid var(--line);border-top:5px solid var(--pc);border-radius:18px;padding:28px;margin-bottom:20px}
.title{font-size:2.3rem;line-height:1.15;font-weight:800;letter-spacing:-.02em;border:0;padding:0;margin-bottom:20px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:96px}
.stat b{display:block;font-size:1.3rem;line-height:1.2}
.stat span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat.late b{color:var(--warn)}
.prog{height:8px;background:color-mix(in srgb,var(--pc) 16%,var(--surface));border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pc);border-radius:4px;transition:width .3s}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 28px -16px rgba(0,0,0,.18)}
.card h2{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--pc)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.row input[type=text]{flex:1 1 140px;width:auto}
.row input[type=date]{width:auto;color:var(--muted)}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.item input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;margin:3px 0 0;padding:0;border:2px solid var(--muted);border-radius:50%;cursor:pointer}
.item input[type=checkbox]:checked{background:var(--pc);border-color:var(--pc);box-shadow:inset 0 0 0 3px var(--surface)}
.pill{display:inline-block;font-size:.76rem;padding:1px 10px;border-radius:99px;background:var(--bg);color:var(--muted);margin-top:2px}
.pill.late{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn);font-weight:600}
.note{padding:12px 0;border-top:1px solid var(--line)}
.note p{margin:2px 0 0;white-space:pre-wrap}
.when{font-size:.78rem;color:var(--muted)}
.x{margin-left:auto;font-size:.78rem;padding:2px 0;opacity:.6}
.x:hover{opacity:1}
.empty{color:var(--muted);padding:6px 0;font-size:.92rem}
.danger{margin-top:24px;font-size:.85rem}
.danger:hover{color:var(--warn)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <p class="brand">Project<span>board</span></p>
    <p class="tag">Every project, one place.</p>
    <form id="pForm"><input id="pName" type="text" placeholder="New project" required aria-label="Project name"><button class="main">Add</button></form>
    <div id="list"></div>
  </aside>
  <main id="detail"></main>
</div>

<script>
const COLORS=["#0e7c78","#c2410c","#6d3fd0","#a16207","#1d4ed8","#a21caf","#3f7d0b"];
let S={projects:[],sel:null};
try{const r=localStorage.getItem("mp-v2");if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem("mp-v2",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const cur=()=>S.projects.find(p=>p.id===S.sel);
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>new Date(d+"T00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"});
const el=(tag,props={},kids=[])=>{const e=document.createElement(tag);Object.assign(e,props);kids.forEach(k=>e.append(k));return e};
const nextDue=p=>p.tasks.filter(t=>!t.done&&t.due).map(t=>t.due).sort()[0];
const pctOf=p=>p.tasks.length?Math.round(p.tasks.filter(t=>t.done).length/p.tasks.length*100):0;

function renderList(){
  const box=$("list");box.innerHTML="";
  if(!S.projects.length){box.append(el("div",{className:"empty",textContent:"Add your first project above."}));return}
  S.projects.forEach(p=>{
    const open=p.tasks.filter(t=>!t.done).length;
    const dot=el("span",{className:"dot"});dot.style.background=p.color;
    const mini=el("div",{className:"mini"},[el("i")]);mini.firstChild.style.width=pctOf(p)+"%";mini.firstChild.style.background=p.color;
    box.append(el("button",{className:"pbtn"+(p.id===S.sel?" on":""),onclick:()=>{S.sel=p.id;save();renderAll()}},
      [el("span",{className:"n"},[dot,p.name]),el("small",{textContent:open+" open"}),mini]));
  });
}

function renderDetail(){
  const box=$("detail");box.innerHTML="";
  const p=cur();
  if(!p){box.append(el("div",{className:"card empty",textContent:"Pick or create a project to see its scope, tasks and notes."}));return}
  box.style.setProperty("--pc",p.color);

  const total=p.tasks.length,done=p.tasks.filter(t=>t.done).length,nd=nextDue(p);
  const stat=(n,l,cls="")=>el("div",{className:"stat "+cls},[el("b",{textContent:n}),el("span",{textContent:l})]);
  const prog=el("div",{className:"prog"},[el("i")]);prog.firstChild.style.width=pctOf(p)+"%";
  const name=el("input",{className:"title",value:p.name,"aria-label":"Project name",
    oninput:()=>{p.name=name.value;save()},onblur:renderList});
  box.append(el("div",{className:"hero"},[name,
    el("div",{className:"stats"},[stat(total-done,"Open"),stat(done,"Done"),stat(nd?fmtD(nd):"None","Next due",nd&&nd<today()?"late":"")]),prog]));

  const scope=el("textarea",{value:p.scope,placeholder:"What's included? What isn't? What needs to be delivered, and when?",
    oninput:()=>{p.scope=scope.value;save()}});
  scope.style.minHeight="130px";
  box.append(el("div",{className:"card"},[el("h2",{textContent:"Scope"}),scope]));

  const tp=el("div",{className:"card"},[el("h2",{textContent:"Tasks"})]);
  const tIn=el("input",{type:"text",placeholder:"New task","aria-label":"New task"});
  const dIn=el("input",{type:"date","aria-label":"Due date"});
  tp.append(el("form",{className:"row",onsubmit:e=>{e.preventDefault();if(!tIn.value.trim())return;
    p.tasks.push({id:uid(),text:tIn.value.trim(),due:dIn.value,done:false});save();renderAll()}},
    [tIn,dIn,el("button",{className:"main",textContent:"Add task"})]));
  if(!p.tasks.length)tp.append(el("div",{className:"empty",textContent:"No tasks yet."}));
  [...p.tasks].sort((a,b)=>a.done-b.done||(a.due||"9999").localeCompare(b.due||"9999")).forEach(t=>{
    const cb=el("input",{type:"checkbox",checked:t.done,"aria-label":"Mark done",onchange:()=>{t.done=cb.checked;save();renderAll()}});
    const late=t.due&&!t.done&&t.due<today();
    const pill=t.due&&!t.done?el("span",{className:"pill"+(late?" late":""),textContent:(late?"Overdue · ":"Due ")+fmtD(t.due)}):"";
    tp.append(el("div",{className:"item"+(t.done?" done":"")},[cb,
      el("div",{},[el("div",{className:"t",textContent:t.text}),pill]),
      el("button",{className:"x",textContent:"Remove",onclick:()=>{p.tasks=p.tasks.filter(x=>x.id!==t.id);save();renderAll()}})]));
  });

  const np=el("div",{className:"card"},[el("h2",{textContent:"Notes"})]);
  const nIn=el("textarea",{placeholder:"Write a note: a meeting, a decision, a request…","aria-label":"New note"});
  nIn.style.minHeight="76px";
  np.append(nIn,el("div",{className:"row",style:"margin:10px 0 4px"},[el("button",{className:"main",textContent:"Save note",onclick:()=>{
    if(!nIn.value.trim())return;p.notes.unshift({id:uid(),text:nIn.value.trim(),at:Date.now()});save();renderAll()}})]));
  if(!p.notes.length)np.append(el("div",{className:"empty",textContent:"Notes show up here, newest first."}));
  p.notes.forEach(n=>{
    const when=new Date(n.at).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    np.append(el("div",{className:"note"},[
      el("div",{className:"row",style:"margin:0"},[el("span",{className:"when",textContent:when}),
        el("button",{className:"x",textContent:"Remove",onclick:()=>{p.notes=p.notes.filter(x=>x.id!==n.id);save();renderAll()}})]),
      el("p",{textContent:n.text})]));
  });
  box.append(el("div",{className:"cols"},[tp,np]));

  box.append(el("button",{className:"danger",textContent:"Delete this project",onclick:()=>{
    if(!confirm("Delete “"+p.name+"” with its tasks and notes?"))return;
    S.projects=S.projects.filter(x=>x.id!==p.id);S.sel=S.projects[0]?.id||null;save();renderAll()}}));
}

function renderAll(){renderList();renderDetail()}
$("pForm").onsubmit=e=>{e.preventDefault();
  const p={id:uid(),name:$("pName").value.trim(),color:COLORS[S.projects.length%COLORS.length],scope:"",tasks:[],notes:[]};
  S.projects.push(p);S.sel=p.id;$("pName").value="";save();renderAll()};
if(!cur())S.sel=S.projects[0]?.id||null;
renderAll();
</script>
</body>
</html>
